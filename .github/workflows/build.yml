# Builds the KAIRO installers for Windows, macOS and Linux on GitHub's computers.
# Runs when started by hand (Actions tab > Build installers > Run workflow) or when a version tag (v0.9.0) is pushed.
# The finished installers appear as downloadable "artifacts" on the run's page. Nothing is published automatically.
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*", "!v*-macos", "!v*-linux"]  # the -macos / -linux release tags hold builds made by this workflow

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Set up Python packages
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install -q -r requirements.txt -r requirements-build.txt
      - name: Build
        run: powershell -ExecutionPolicy Bypass -File packaging\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: KAIRO-windows
          path: dist/KAIRO-Setup-*

  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]   # Apple Silicon and Intel Macs
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: PYTHON=python3 bash packaging/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: KAIRO-macos-${{ matrix.runner }}
          path: dist/*.dmg*

  linux:
    runs-on: ubuntu-22.04   # older base = the package runs on more distributions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev xvfb
      - name: Build
        run: PYTHON=python3 xvfb-run -a bash packaging/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: KAIRO-linux
          path: |
            dist/*.tar.gz*
            dist/*.deb*
